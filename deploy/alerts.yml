groups:
  - name: genmedia-guard
    rules:
      - alert: GenMediaHighErrorRate
        expr: |
          sum(rate(genmedia_requests_total{status="error"}[2m]))
            / sum(rate(genmedia_requests_total[2m])) > 0.02
        for: 1m
        labels: { severity: page }
        annotations:
          summary: "Error rate above the 2% SLO"

      - alert: GenMediaLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(genmedia_request_duration_seconds_bucket[2m]))) > 2.5
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "p95 latency above the 2.5s SLO"

      - alert: GenMediaQualityFailures
        expr: sum(rate(genmedia_quality_failures_total[5m])) > 0
        for: 2m
        labels: { severity: ticket }
        annotations:
          summary: "Outputs are failing the quality gate (blank / saturated images)"

      - alert: GenMediaCanaryRolledBack
        expr: increase(genmedia_canary_rollbacks_total[10m]) > 0
        labels: { severity: ticket }
        annotations:
          summary: "A canary was automatically rolled back; see /canary for the reasons"
